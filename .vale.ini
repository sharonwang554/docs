# Vale configuration for docs.sharonwang.me
# Style guides: Google Developer Docs + Microsoft Writing Style Guide
# Framework: Diátaxis documentation architecture

StylesPath = .vale/styles
MinAlertLevel = error

# Vale packages (synced via `vale sync`)
Packages = Google, Microsoft

# Treat .mdx files as Markdown (avoids mdx2vast dependency)
[formats]
mdx = md

# Scope: lint all MDX and Markdown content
[src/content/docs/**/*.mdx]
BasedOnStyles = Vale, Google, Microsoft

# Disable rules that conflict with our domain-specific terminology
Google.Acronyms = NO
Google.We = NO
Microsoft.Contractions = suggestion
Microsoft.HeadingAcronyms = NO

# Allow technical abbreviations common in our docs
Vale.Spelling = suggestion
